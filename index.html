<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101317" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="《女神之殇：无旗者》轻量叙事战术原型" />
    <link rel="icon" type="image/webp" href="/assets/images/campaign-route-map.webp" />
    <title>女神之殇：无旗者</title>
    <style>
      .boot{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#080f14;color:#e7d8ba;font-family:"Noto Serif SC","Songti SC",serif}
      .boot::before,.boot::after{content:"";position:absolute;pointer-events:none;border-radius:50%;filter:blur(1px)}
      .boot::before{width:min(72vw,760px);height:min(72vw,760px);background:radial-gradient(circle,#a47b3b1c 0%,#a47b3b09 34%,transparent 69%);animation:boot-breathe 3.8s ease-in-out infinite}
      .boot::after{inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 0 37%,#04080c99 100%)}
      .boot.boot-leaving{animation:boot-exit .26s ease forwards;pointer-events:none}
      .boot-card{position:relative;z-index:1;width:min(420px,calc(100% - 46px));padding:42px 34px 30px;border:1px solid #aa854d88;background:linear-gradient(145deg,#142128e8,#0b1319f2);box-shadow:0 28px 90px #000b;text-align:center;animation:boot-card-in .8s cubic-bezier(.2,.8,.2,1) both}
      .boot-kicker{margin:0;color:#d0a85e;font:700 .68rem/1.4 system-ui,sans-serif;letter-spacing:.22em}
      .boot-card h1{margin:13px 0 8px;color:#f0dfbd;font-size:clamp(2.7rem,10vw,4.7rem);font-weight:500;letter-spacing:.16em;line-height:1}
      .boot-subtitle{margin:0;color:#9da9aa;font:500 .75rem/1.8 system-ui,sans-serif;letter-spacing:.1em}
      .boot-seal{position:relative;width:86px;height:86px;margin:0 auto 22px;border:1px solid #c39a5866;border-radius:50%;animation:boot-seal-drift 4s ease-in-out infinite}
      .boot-seal::before,.boot-seal::after{content:"";position:absolute;inset:8px;border:1px solid #c39a5866;border-radius:50%;transform:rotate(45deg);animation:boot-seal-spin 12s linear infinite}
      .boot-seal::after{inset:20px;border-style:dashed;animation-direction:reverse;animation-duration:8s}
      .boot-seal span{position:absolute;left:50%;top:50%;width:15px;height:15px;translate:-50% -50%;border-radius:50%;background:#f0c772;box-shadow:0 0 12px #f0c772,0 0 34px #c17f2f99;animation:boot-flame 1.25s ease-in-out infinite}
      .boot-seal i{position:absolute;left:50%;bottom:-15px;width:1px;height:28px;background:linear-gradient(#d9ae5b,transparent);transform-origin:top;animation:boot-ray 1.25s ease-in-out infinite}
      .boot-progress{position:relative;height:3px;margin:27px 2px 12px;overflow:hidden;background:#243139}
      .boot-progress i{position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#d5a955 44%,#f4dda9 50%,#d5a955 56%,transparent);animation:boot-progress 2.2s ease-in-out infinite}
      .boot-meta{display:flex;justify-content:space-between;gap:12px;color:#7d8b8f;font:600 .64rem/1.5 system-ui,sans-serif;letter-spacing:.08em}
      .boot-meta span:first-child{font-size:0}
      .boot-meta span:first-child::after{content:"整理档案";font-size:.64rem;animation:boot-status 4.8s steps(1,end) infinite}
      .boot-meta span:last-child{color:#b69862}
      @keyframes boot-card-in{from{opacity:0;translate:0 14px;transform:scale(.97)}to{opacity:1;translate:0 0;transform:scale(1)}}
      @keyframes boot-breathe{0%,100%{scale:.92;opacity:.7}50%{scale:1.06;opacity:1}}
      @keyframes boot-seal-spin{to{rotate:360deg}}
      @keyframes boot-seal-drift{0%,100%{translate:0 0}50%{translate:0 -5px}}
      @keyframes boot-flame{0%,100%{scale:.78;opacity:.72}50%{scale:1.28;opacity:1}}
      @keyframes boot-ray{0%,100%{scale-y:.65;opacity:.55}50%{scale-y:1.1;opacity:1}}
      @keyframes boot-progress{0%{transform:translateX(-100%)}55%,100%{transform:translateX(100%)}}
      @keyframes boot-status{0%,28%{content:"整理档案"}29%,62%{content:"校准路线"}63%,100%{content:"点燃圣火"}}
      @keyframes boot-exit{to{opacity:0;transform:scale(1.015);filter:blur(3px)}}
      @media(prefers-reduced-motion:reduce){.boot *,.boot::before{animation:none!important}.boot-progress i{transform:translateX(0)}}
    </style>
  </head>
  <body>
    <noscript>本游戏需要启用 JavaScript。</noscript>
    <div id="app">
      <div class="boot" role="status" aria-live="polite">
        <section class="boot-card" aria-label="正在加载游戏">
          <div class="boot-seal" aria-hidden="true"><span></span><i></i></div>
          <p class="boot-kicker">无旗使团 · 第一季</p>
          <h1>女神之殇</h1>
          <p class="boot-subtitle">在神迹、战争与人的记忆之间</p>
          <div class="boot-progress" aria-hidden="true"><i></i></div>
          <div class="boot-meta"><span>正在整理档案</span><span>请稍候</span></div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
